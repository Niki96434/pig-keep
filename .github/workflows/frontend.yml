name: Frontend CI

on:
  push:
    branches:
    - main
    - dev
    - 'feature/**'
    - 'fix/**'
    paths:
    - 'frontend/**'
    - '.github/workflows/frontend.yml'

  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7

      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
    - run: npm ci
    - run: npm run lint
    - run: npm run prettier:check
    - run: npm run typecheck
    - run: npm run test:ci
    - run: npm run build

    defaults:
      run:
        working-directory: frontend
