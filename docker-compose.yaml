services:
  db:
    image: postgres:18.4
    ports:
      - "${PGPORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PGUSER:-google_keep}
      POSTGRES_DB: ${PGDATABASE:-google_keepdb}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lib/postgresql
    env_file:
      - ./backend/.env
    secrets:
      - pg-password

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - ORIGIN=${ORIGIN:-http://localhost:8080}
      - DATABASE_URL=postgres://${PGUSER:-google_keep}:${PGPASSWORD:-p@ssw0rd}@db:5432/${PGDATABASE:-google_keepdb}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  db-data:

secrets:
  pg-password:
    file: ./backend/db_password.txt
