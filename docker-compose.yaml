services:
  db_dev:
    image: postgres:18-bookworm
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 3s
      timeout: 5s
      retries: 5

  db_test:
    image: postgres:18-bookworm
    profiles: [test]
    container_name: postgres-test
    environment:
      POSTGRES_USER: ${TEST_USER:-nika}
      POSTGRES_PASSWORD: ${TEST_PASSWORD:-nikakika2004}
      POSTGRES_DB: ${TEST_DB:-notes_test}
    ports:
      - "${TEST_PGPORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    env_file:
      - .env.test

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      - server

  server:
    build: ./backend
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      db_dev:
        condition: service_healthy

volumes:
  postgres_data:
